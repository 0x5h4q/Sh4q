name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify wheel installs in a clean environment
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/*.whl
          /tmp/verify-venv/bin/sh4q --help >/dev/null

      - name: Draft release body from CHANGELOG head
        run: |
          awk '/^## [0-9]/{c++} c==1{print} c==2{exit}' CHANGELOG.md > release-body.md

      - name: Append version comparison link
        run: |
          PREV=$(git tag -l --sort=-v:refname 'v*' \
            | grep -vE '(-alpha|-beta|-rc|-pre)' \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | head -1 || true)
          if [ -n "$PREV" ]; then
            COUNT=$(git rev-list --count "$PREV"..HEAD)
            {
              echo
              echo "---"
              echo
              echo "**Commits since ${PREV}:** ${COUNT}"
              echo "**Full Changelog:** https://github.com/0x5h4q/Sh4q/compare/${PREV}...${GITHUB_REF_NAME}"
            } >> release-body.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz