[project]
name = "sh4q"
version = "1.2.0"
description = "Sh4q — scope-aware, discovery-only reconnaissance orchestration framework"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "dnspython>=2.7,<3",
]

[project.scripts]
sh4q = "sh4q.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sh4q*"]

[tool.setuptools.package-data]
sh4q = ["assets/*.png"]
